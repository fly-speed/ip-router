<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Router</title>
  <style>
    body {
      margin: 0;
      background: #f4f7fb;
      color: #182230;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 1100px; margin: 48px auto; padding: 0 20px; }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 7px 0 0; color: #667085; }
    .actions a { margin-left: 16px; color: #175cd3; text-decoration: none; }
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      overflow: hidden;
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(16, 24, 40, .05);
    }
    .panel { padding: 20px; }
    .panel h2 { margin: 0 0 16px; font-size: 17px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }
    label { display: grid; gap: 6px; color: #475467; font-size: 13px; }
    input, select {
      min-width: 0;
      padding: 9px 11px;
      color: #182230;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      outline: none;
    }
    input:focus, select:focus { border-color: #84adff; box-shadow: 0 0 0 3px #d1e0ff; }
    .form-actions { display: flex; align-items: end; }
    button {
      padding: 9px 15px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      background: #175cd3;
      border: 0;
      border-radius: 7px;
    }
    button:hover { background: #1849a9; }
    button:disabled { cursor: wait; opacity: .6; }
    button.danger { background: #d92d20; }
    button.danger:hover { background: #b42318; }
    button.small { padding: 6px 10px; font-size: 12px; }
    .hint { grid-column: 1 / -1; margin: -4px 0 0; font-size: 12px; }
    .notice {
      display: none;
      margin-bottom: 20px;
      padding: 11px 14px;
      border: 1px solid;
      border-radius: 8px;
      font-size: 14px;
    }
    .notice.success { display: block; color: #027a48; background: #ecfdf3; border-color: #abefc6; }
    .notice.warning { display: block; color: #b54708; background: #fffaeb; border-color: #fedf89; }
    .notice.error { display: block; color: #b42318; background: #fef3f2; border-color: #fecdca; }
    .list-section { margin-top: 20px; }
    .list-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 2px 10px;
    }
    .list-heading h2 { margin: 0; font-size: 18px; }
    .list-heading p { margin: 0; font-size: 13px; }
    .table-card { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 13px 16px;
      text-align: left;
      border-bottom: 1px solid #eaecf0;
    }
    th { background: #f9fafb; color: #475467; font-size: 13px; }
    .sort-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      color: inherit;
      font: inherit;
      background: transparent;
      border: 0;
      border-radius: 3px;
    }
    .sort-button:hover { color: #175cd3; background: transparent; }
    .sort-button:focus-visible { outline: 2px solid #84adff; outline-offset: 3px; }
    .sort-indicator { min-width: 12px; color: #667085; }
    td { font-size: 14px; }
    tr:last-child td { border-bottom: 0; }
    code { color: #175cd3; }
    .empty { padding: 48px; color: #667085; text-align: center; }
    .permanent { color: #027a48; }
    .expiring { color: #b54708; }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      color: #475467;
      background: #f9fafb;
      border-top: 1px solid #eaecf0;
      font-size: 13px;
    }
    .page-size, .page-buttons { display: flex; align-items: center; gap: 8px; }
    .pagination select { padding: 6px 28px 6px 9px; }
    .pagination button {
      padding: 6px 11px;
      color: #344054;
      background: #fff;
      border: 1px solid #d0d5dd;
    }
    .pagination button:hover:not(:disabled) { background: #f2f4f7; }
    .pagination button:disabled { cursor: default; opacity: .45; }
    @media (max-width: 800px) {
      main { margin-top: 24px; }
      header { align-items: start; }
      .controls { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .pagination { align-items: stretch; flex-direction: column; }
      .page-buttons { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>IP 路由列表</h1>
        <p id="summary">正在加载路由列表…</p>
      </div>
      <div class="actions">
        <a id="refresh" href="/">刷新</a>
        <a href="/routes">查看 JSON</a>
        <a href="/system-routes">系统 JSON</a>
      </div>
    </header>
    <div class="controls">
      <section class="card panel">
        <h2>添加路由</h2>
        <form id="add-form" class="form-grid">
          <label>
            KEY
            <input name="key" maxlength="256" required placeholder="例如 dns.google">
          </label>
          <label>
            目标 IP
            <input name="ips" required placeholder="多个 IP 用逗号或空格分隔">
          </label>
          <label>
            网关 IP
            <input name="gateway" required placeholder="例如 192.168.1.1">
          </label>
          <label>
            TTL（秒）
            <input name="ttl" type="number" min="0" step="1" value="0">
          </label>
          <p class="hint">TTL 为 0 表示永久；同一 KEY 可以一次添加多个目标 IP。</p>
          <div class="form-actions"><button type="submit">添加路由</button></div>
        </form>
      </section>
      <section class="card panel">
        <h2>批量删除</h2>
        <form id="delete-form" class="form-grid">
          <label>
            KEY（可选）
            <input name="key" maxlength="256" placeholder="删除整个 KEY 或配合 IP">
          </label>
          <label>
            目标 IP（可选）
            <input name="ip" placeholder="删除所有匹配 IP">
          </label>
          <p class="hint">至少填写一项；同时填写时只删除该 KEY 下的指定 IP。</p>
          <div class="form-actions"><button class="danger" type="submit">删除路由</button></div>
        </form>
      </section>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section class="list-section">
      <div class="list-heading">
        <h2>服务内存路由</h2>
        <p>包含 KEY、TTL 等服务管理信息</p>
      </div>
      <div class="card table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th id="key-sort-header" aria-sort="ascending">
                  <button id="key-sort" class="sort-button" type="button">
                    KEY <span id="key-sort-indicator" class="sort-indicator">▲</span>
                  </button>
                </th>
                <th>目标 IP</th>
                <th>网关</th>
                <th>TTL</th>
                <th id="expiration-sort-header" aria-sort="none">
                  <button id="expiration-sort" class="sort-button" type="button">
                    过期时间 <span id="expiration-sort-indicator" class="sort-indicator">↕</span>
                  </button>
                </th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="route-rows">
              <tr><td class="empty" colspan="6">正在加载…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <label class="page-size">每页
            <select id="route-page-size" aria-label="内存路由每页数量">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>条
          </label>
          <div class="page-buttons">
            <button id="route-prev" type="button">上一页</button>
            <span id="route-page-info">第 1 / 1 页</span>
            <button id="route-next" type="button">下一页</button>
          </div>
        </div>
      </div>
    </section>
    <section class="list-section">
      <div class="list-heading">
        <h2>系统静态主机路由</h2>
        <p id="system-summary">正在直接读取系统路由表…</p>
      </div>
      <div class="card table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>目标 IP</th>
                <th>网关</th>
                <th>网络接口</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="system-route-rows">
              <tr><td class="empty" colspan="4">正在加载…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <label class="page-size">每页
            <select id="system-page-size" aria-label="系统路由每页数量">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>条
          </label>
          <div class="page-buttons">
            <button id="system-prev" type="button">上一页</button>
            <span id="system-page-info">第 1 / 1 页</span>
            <button id="system-next" type="button">下一页</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const summary = document.getElementById("summary");
    const rows = document.getElementById("route-rows");
    const systemSummary = document.getElementById("system-summary");
    const systemRows = document.getElementById("system-route-rows");
    const notice = document.getElementById("notice");
    const routePager = {
      page: 1,
      pageSize: 50,
      items: [],
      sortField: "key",
      sortDirection: "asc",
      pageSizeElement: document.getElementById("route-page-size"),
      previous: document.getElementById("route-prev"),
      next: document.getElementById("route-next"),
      info: document.getElementById("route-page-info")
    };
    const systemPager = {
      page: 1,
      pageSize: 50,
      items: [],
      pageSizeElement: document.getElementById("system-page-size"),
      previous: document.getElementById("system-prev"),
      next: document.getElementById("system-next"),
      info: document.getElementById("system-page-info")
    };

    function addCell(row, value, className, code) {
      const cell = document.createElement("td");
      const node = code ? document.createElement("code") : cell;
      node.textContent = value;
      if (code) cell.appendChild(node);
      if (className) cell.className = className;
      row.appendChild(cell);
    }

    function showMessage(message) {
      rows.replaceChildren();
      const row = document.createElement("tr");
      addCell(row, message, "empty");
      row.firstChild.colSpan = 6;
      rows.appendChild(row);
    }

    function showSystemMessage(message) {
      systemRows.replaceChildren();
      const row = document.createElement("tr");
      addCell(row, message, "empty");
      row.firstChild.colSpan = 4;
      systemRows.appendChild(row);
    }

    function showNotice(message, type) {
      notice.textContent = message;
      notice.className = `notice ${type}`;
    }

    async function routeRequest(method, parameters, path = "/route") {
      const query = new URLSearchParams();
      Object.entries(parameters).forEach(([name, value]) => {
        if (value !== "" && value !== null && value !== undefined) {
          query.set(name, value);
        }
      });
      const response = await fetch(`${path}?${query}`, { method });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.message || `HTTP ${response.status}`);
      }
      return data;
    }

    function addDeleteButton(row, key, ip) {
      const cell = document.createElement("td");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "danger small";
      button.textContent = "删除";
      button.addEventListener("click", async () => {
        if (!window.confirm(`确定删除 ${key} 下的 ${ip} 路由吗？`)) return;
        button.disabled = true;
        try {
          const data = await routeRequest("DELETE", { key, ip });
          showNotice(data.message || "路由已删除", data.success ? "success" : "warning");
          await loadAllRoutes();
        } catch (error) {
          showNotice(`删除失败：${error.message}`, "error");
        } finally {
          button.disabled = false;
        }
      });
      cell.appendChild(button);
      row.appendChild(cell);
    }

    function addSystemDeleteButton(row, ip, gateway) {
      const cell = document.createElement("td");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "danger small";
      button.textContent = "从系统删除";
      button.addEventListener("click", async () => {
        if (!window.confirm(`确定从系统路由表删除 ${ip}（网关 ${gateway}）吗？`)) return;
        button.disabled = true;
        try {
          const data = await routeRequest("DELETE", { ip, gateway }, "/system-route");
          showNotice(data.message || "系统路由已删除", "success");
          await loadAllRoutes();
        } catch (error) {
          showNotice(`系统路由删除失败：${error.message}`, "error");
        } finally {
          button.disabled = false;
        }
      });
      cell.appendChild(button);
      row.appendChild(cell);
    }

    function updatePager(pager) {
      const pageCount = Math.max(1, Math.ceil(pager.items.length / pager.pageSize));
      pager.page = Math.min(Math.max(1, pager.page), pageCount);
      pager.info.textContent = `第 ${pager.page} / ${pageCount} 页，共 ${pager.items.length} 条`;
      pager.previous.disabled = pager.page <= 1;
      pager.next.disabled = pager.page >= pageCount;
    }

    function currentPageItems(pager) {
      updatePager(pager);
      const start = (pager.page - 1) * pager.pageSize;
      return pager.items.slice(start, start + pager.pageSize);
    }

    function compareText(left, right) {
      return String(left).localeCompare(String(right), "zh-CN", {
        numeric: true,
        sensitivity: "base"
      });
    }

    function compareRouteItems(left, right) {
      let result = 0;
      if (routePager.sortField === "expiration") {
        const leftExpiration = Number(left.target.expires_at) > 0
          ? Number(left.target.expires_at) : Number.POSITIVE_INFINITY;
        const rightExpiration = Number(right.target.expires_at) > 0
          ? Number(right.target.expires_at) : Number.POSITIVE_INFINITY;
        if (leftExpiration < rightExpiration) result = -1;
        if (leftExpiration > rightExpiration) result = 1;
      } else {
        result = compareText(left.key, right.key);
      }
      if (result === 0) result = compareText(left.key, right.key);
      if (result === 0) result = compareText(left.target.ip || "", right.target.ip || "");
      return routePager.sortDirection === "asc" ? result : -result;
    }

    function currentRoutePageItems() {
      updatePager(routePager);
      const start = (routePager.page - 1) * routePager.pageSize;
      return routePager.items.slice().sort(compareRouteItems)
        .slice(start, start + routePager.pageSize);
    }

    function updateRouteSortHeaders() {
      ["key", "expiration"].forEach((field) => {
        const active = routePager.sortField === field;
        const direction = active ? routePager.sortDirection : "none";
        document.getElementById(`${field}-sort-header`).setAttribute(
          "aria-sort",
          direction === "asc" ? "ascending" : direction === "desc" ? "descending" : "none"
        );
        document.getElementById(`${field}-sort-indicator`).textContent = !active
          ? "↕" : routePager.sortDirection === "asc" ? "▲" : "▼";
      });
    }

    function changeRouteSort(field) {
      if (routePager.sortField === field) {
        routePager.sortDirection = routePager.sortDirection === "asc" ? "desc" : "asc";
      } else {
        routePager.sortField = field;
        routePager.sortDirection = "asc";
      }
      routePager.page = 1;
      updateRouteSortHeaders();
      renderRoutePage();
    }

    function renderRoutePage() {
      rows.replaceChildren();
      if (routePager.items.length === 0) {
        updatePager(routePager);
        showMessage("尚未设置路由");
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      currentRoutePageItems().forEach(({ key, target }) => {
        const row = document.createElement("tr");
        addCell(row, key, "", true);
        addCell(row, target.ip || "");
        addCell(row, target.gateway || "");
        if (target.expires_at > 0) {
          const remaining = Math.max(0, target.expires_at - now);
          addCell(row, `${target.ttl} 秒（剩余 ${remaining} 秒）`, "expiring");
          addCell(row, String(target.expires_at));
        } else {
          addCell(row, "永久", "permanent");
          addCell(row, "—");
        }
        addDeleteButton(row, key, target.ip || "");
        rows.appendChild(row);
      });
    }

    function renderRoutes(groups) {
      routePager.items = [];
      groups.forEach((group) => {
        (group.ips || []).forEach((target) => {
          routePager.items.push({ key: group.key || "", target });
        });
      });
      summary.textContent = `共 ${groups.length} 个 KEY，${routePager.items.length} 条路由`;
      renderRoutePage();
    }

    async function loadRoutes() {
      try {
        const response = await fetch("/routes", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderRoutes(Array.isArray(data.routes) ? data.routes : []);
      } catch (error) {
        summary.textContent = "路由列表加载失败";
        showMessage(`加载失败：${error.message}`);
      }
    }

    function renderSystemRoutePage() {
      systemRows.replaceChildren();
      if (systemPager.items.length === 0) {
        updatePager(systemPager);
        showSystemMessage("系统中没有匹配的静态主机路由");
        return;
      }
      currentPageItems(systemPager).forEach((route) => {
        const row = document.createElement("tr");
        addCell(row, route.ip || "");
        addCell(row, route.gateway || "");
        addCell(row, route.interface || "—");
        addSystemDeleteButton(row, route.ip || "", route.gateway || "");
        systemRows.appendChild(row);
      });
    }

    function renderSystemRoutes(routes) {
      systemPager.items = routes;
      systemSummary.textContent = `从系统路由表读取到 ${routes.length} 条静态主机路由`;
      renderSystemRoutePage();
    }

    function bindPagination(pager, render) {
      pager.pageSizeElement.addEventListener("change", () => {
        pager.pageSize = Number(pager.pageSizeElement.value);
        pager.page = 1;
        render();
      });
      pager.previous.addEventListener("click", () => {
        pager.page -= 1;
        render();
      });
      pager.next.addEventListener("click", () => {
        pager.page += 1;
        render();
      });
    }

    async function loadSystemRoutes() {
      try {
        const response = await fetch("/system-routes", { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
        renderSystemRoutes(Array.isArray(data.routes) ? data.routes : []);
      } catch (error) {
        systemSummary.textContent = "系统路由表加载失败";
        showSystemMessage(`加载失败：${error.message}`);
      }
    }

    async function loadAllRoutes() {
      await Promise.all([loadRoutes(), loadSystemRoutes()]);
    }

    document.getElementById("refresh").addEventListener("click", (event) => {
      event.preventDefault();
      loadAllRoutes();
    });

    document.getElementById("add-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type=submit]");
      const values = Object.fromEntries(new FormData(form));
      button.disabled = true;
      try {
        const data = await routeRequest("POST", values);
        const count = data.count === undefined ? 1 : data.count;
        const succeeded = data.succeeded === undefined ? 1 : data.succeeded;
        showNotice(`添加完成：成功 ${succeeded}/${count} 条`, data.success ? "success" : "warning");
        await loadAllRoutes();
      } catch (error) {
        showNotice(`添加失败：${error.message}`, "error");
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("delete-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type=submit]");
      const values = Object.fromEntries(new FormData(form));
      if (!values.key && !values.ip) {
        showNotice("删除时至少需要填写 KEY 或目标 IP", "error");
        return;
      }
      if (!window.confirm("确定删除所有匹配的路由吗？")) return;
      button.disabled = true;
      try {
        const data = await routeRequest("DELETE", values);
        showNotice(`删除完成：成功 ${data.succeeded}/${data.count} 条`,
          data.success ? "success" : "warning");
        await loadAllRoutes();
      } catch (error) {
        showNotice(`删除失败：${error.message}`, "error");
      } finally {
        button.disabled = false;
      }
    });
    bindPagination(routePager, renderRoutePage);
    bindPagination(systemPager, renderSystemRoutePage);
    document.getElementById("key-sort").addEventListener("click", () => {
      changeRouteSort("key");
    });
    document.getElementById("expiration-sort").addEventListener("click", () => {
      changeRouteSort("expiration");
    });
    updateRouteSortHeaders();
    loadAllRoutes();
  </script>
</body>
</html>
